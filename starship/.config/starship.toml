# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Sets user-defined palette
# Palettes must be defined _after_ this line
palette = "blues"

format = """
[](fg:b1 bg:base)\
[$os](fg:white bg:b1)\
[$username](fg:white bg:b1)[@ ](fg:white bg:b1)[$shell](fg:white bg:b1)\
[](fg:b1 bg:b2)\
[$directory](fg:white bg:b2)\
[](fg:b2 bg:b3)\
[$git_branch](fg:white bg:b3)\
[$git_status](fg:white bg:b3)\
[](fg:b3 bg:b4)\
[$c](fg:white bg:b4)\
[$elixir](fg:white bg:b4)\
[$elm](fg:white bg:b4)\
[$golang](fg:white bg:b4)\
[$gradle](fg:white bg:b4)\
[$haskell](fg:white bg:b4)\
[$java](fg:white bg:b4)\
[$julia](fg:white bg:b4)\
[$nodejs](fg:white bg:b4)\
[$nim](fg:white bg:b4)\
[$rust](fg:white bg:b4)\
[$scala](fg:white bg:b4)\
[](fg:b4 bg:b5)\
[$docker_context](fg:white bg:b5)\
[](fg:b5 bg:b6)\
[$time](fg:white bg:b6)\
[](fg:b6 bg:base)\n$character
"""

right_format = "$custom"

command_timeout = 300

# Disable the blank line at the start of the prompt
# add_newline = false

# Writing a custom module for mommy O_o
[custom.mommy]
command = "mommy -1 -s $status"
when = "true"

# You can also replace your username with a neat symbol like   or disable this
# and use the os module below
[username]
show_always = true
aliases = {"root" = "", "tori" = "", "chroot" = "󰽰"}

format = '$user '
disabled = false

# An alternative to the username module which displays a symbol that
# represents the current operating system
[os]
disabled = false # Disabled by default
style = "$os "

[shell]
format = '$indicator'
bash_indicator = " "
fish_indicator = " "
zsh_indicator = " "
powershell_indicator = " "
ion_indicator = " "
elvish_indicator = "󰘧 "
tcsh_indicator = "  "
xonsh_indicator = "󱙷 "
cmd_indicator = " "
nu_indicator = " "
unknown_indicator = " "
disabled = false

[directory]
read_only = " 󰌾"
format = " $path "
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[aws]
symbol = " "

[buf]
symbol = " "

[c]
symbol = " "

format = ' $symbol ($version) '

[cmake]
symbol = " "

[conda]
symbol = " "

[crystal]
symbol = " "

[dart]
symbol = " "

[docker_context]
symbol = " "
format = ' $symbol $context '

[elixir]
symbol = " "

format = ' $symbol ($version) '

[elm]
symbol = " "

format = ' $symbol ($version) '

[fennel]
symbol = " "

[fossil_branch]
symbol = " "

[git_branch]
symbol = " "
format = ' $symbol $branch '

[git_commit]
tag_symbol = '  '

[git_status]
format = '$all_status$ahead_behind '

[golang]
