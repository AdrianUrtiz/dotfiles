format = ' $symbol ($version) '

[julia]
symbol = " "

format = ' $symbol ($version) '

[kotlin]
symbol = " "

[lua]
symbol = " "

[memory_usage]
symbol = "󰍛 "

[meson]
symbol = "󰔷 "

[nodejs]
symbol = " "

format = ' $symbol ($version) '

[nim]
symbol = "󰆥 "

format = ' $symbol ($version) '

[nix_shell]
symbol = " "

[ocaml]
symbol = " "

[package]
symbol = "󰏗 "

[perl]
symbol = " "

[php]
symbol = " "

[pijul_channel]
symbol = " "

[python]
symbol = " "

[rlang]
symbol = "󰟔 "

[ruby]
symbol = " "

[rust]
symbol = " "

format = ' $symbol ($version) '

[scala]
symbol = " "

format = ' $symbol ($version) '

[swift]
